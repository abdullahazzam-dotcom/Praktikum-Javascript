<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h2>Praktikum Basic JavaScript</h2>
    <p>Lihat hasil melalui Console (F12)</p>

    <script>
      // TULIS KODE DI SINI
      
        console.log("=== 2. Output, Variabel, dan Tipe Data ===");

        const nama = "Alya";
        let umur = 19;
        let nilai = 85;
        let aktif = true;

        console.log("Nama:", nama);
        console.log("Umur:", umur);
        console.log("Nilai:", nilai);
        console.log("Status aktif:", aktif);
        console.log("Tipe nilai:", typeof nilai);

        const prodi = "Teknik Informatika";
        console.log("Prodi:", prodi);

        console.log("\n=== 3. Operator dan Perhitungan Sederhana ===");

        const tugas = 80;
        const uts = 75;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai akhir:", akhir);
        console.log("Lulus:", akhir >= 60);

        const uas2 = 50;
        const akhir2 = tugas * 0.30 + uts * 0.30 + uas2 * 0.40;
        console.log("Nilai akhir (UAS 50):", akhir2);
        console.log("Lulus (UAS 50):", akhir2 >= 60);

        console.log("\n=== 4. Percabangan if, else if, else ===");

        const nilaiKategori = 78;
        let kategori;

        if (nilaiKategori >= 85) {
            kategori = "A";
        } else if (nilaiKategori >= 70) {
            kategori = "B";
        } else if (nilaiKategori >= 60) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("Nilai:", nilaiKategori);
        console.log("Kategori:", kategori);

        function cekKategori(n) {
            if (n >= 85) return "A";
            else if (n >= 70) return "B";
            else if (n >= 60) return "C";
            else return "D";
        }

        console.log("Nilai 92 → Kategori:", cekKategori(92));
        console.log("Nilai 65 → Kategori:", cekKategori(65));
        console.log("Nilai 45 → Kategori:", cekKategori(45));

        console.log("\n=== 5. Perulangan dan Fungsi Dasar ===");

        function hitungDiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 1; i <= 3; i++) {
            const harga = i * 10000;
            const bayar = hitungDiskon(harga, 10);
            console.log("Barang", i, "Harga:", harga, "Bayar:", bayar);
        }

        console.log("\n=== D. Praktikum Mandiri Pengolah Nilai Mahasiswa ===");

        const namaMahasiswa = "Abdullah azzam";
        const nilaiTugas = 80;
        const nilaiUTS = 70;
        const nilaiUAS = 90;

        const nilaiAkhir = (nilaiTugas * 0.60) + (nilaiUTS * 0.30) + (nilaiUAS * 0.40);

        let statusKelulusan;
        if (nilaiAkhir >= 60) {
            statusKelulusan = "LULUS";
        } else {
            statusKelulusan = "TIDAK LULUS";
        }

        console.log("Nama mahasiswa:", namaMahasiswa);
        console.log("Nilai akhir:", nilaiAkhir);
        console.log("Status kelulusan:", statusKelulusan);
    </script>
</body>
</html>
